<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
   <div class="container">
     <header>
        <div class="logo">
          <img src="/src/image/pokemon-logo.png" alt="pokemon-logo">
        </div>
        <div class="nav-bar">
            <div class="type select">
              <label for="type">Type</label>
              <select name="pokemon-type" id="type">
                <option value="Any">Any</option>
                <option value="Bug">Fire</option>
                <option value="Dark">Dark</option>
                <option value="Dragon">Dragon</option>
                <option value="Electirc">Electirc</option>
              </select>
              <i class="fa-solid fa-caret-down"></i>
            </div>
            <div class="capture select">
              <label for="capture">Captures</label>
              <select name="pokemon-type" id="capture">
                <option value="Any">Any</option>
                <option value="Captured">Captured</option>
                <option value="Not-captured">Not-capture</option>
              </select>
              <i class="fa-solid fa-caret-down"></i>
            </div>
        </div>
     </header>
     <div class="grid-container">
        <div class="card">
            <div class="sequent">2</div>
            <div class="image">
                <img src="/src/image/ivysaur.png" alt="ivysaur">
            </div>
            <div class="name">Ivysaur</div>
            <div class="pokemon-type">Poison, Grass</div>
        </div>
        <div class="card">
          <div class="sequent">3</div>
          <div class="image">
              <img src="/src/image/Venusaur.png" alt="venusaur">
          </div>
          <div class="name">Venusaur</div>
          <div class="pokemon-type">Poison, Grass</div>
        </div>
        <div class="card">
          <div class="sequent">4</div>
          <div class="image">
              <img src="/src/image/Charmander.png" alt="charmander">
          </div>
          <div class="name">Charmander</div>
          <div class="pokemon-type">Fire</div>
        </div>
        <div class="card">
          <div class="sequent">5</div>
          <div class="image">
              <img src="/src/image/Charmeleon.png" alt="charmeleon">
          </div>
          <div class="name">Charmeleon</div>
          <div class="pokemon-type">Fire</div>
        </div>
        <div class="card">
          <div class="sequent">6</div>
          <div class="image">
              <img src="/src/image/Charizard.png" alt="charizard">
          </div>
          <div class="name">Charizard</div>
          <div class="pokemon-type">Fire, Flying</div>
        </div>
        <div class="card">
          <div class="sequent">7</div>
          <div class="image">
              <img src="/src/image/Squirtle.png" alt="squirtle">
          </div>
          <div class="name">Squirtle</div>
          <div class="pokemon-type">Water</div>
        </div>
        <div class="card">
          <div class="sequent">8</div>
          <div class="image">
              <img src="/src/image/Wartortle.png" alt="wartortle">
          </div>
          <div class="name">Wartortle</div>
          <div class="pokemon-type">Water</div>
        </div>
        <div class="card">
          <div class="sequent">9</div>
          <div class="image">
              <img src="/src/image/Blastoise.png" alt="blastoise">
          </div>
          <div class="name">Blastoise</div>
          <div class="pokemon-type">Water</div>
        </div>
        <div class="card">
          <div class="sequent">10</div>
          <div class="image">
              <img src="/src/image/Caterpie.png" alt="caterpie">
          </div>
          <div class="name">Caterpie</div>
          <div class="pokemon-type">Bug</div>
        </div>
        <div class="card">
          <div class="sequent">11</div>
          <div class="image">
              <img src="/src/image/Metapod.png" alt="metapod">
          </div>
          <div class="name">Metapod</div>
          <div class="pokemon-type">Bug</div>
        </div>
     </div>
   </div>
  </body>
</html>
